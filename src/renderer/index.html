<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Fonts are bundled locally via @fontsource (no CDN) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-1aObDuz+lGdhip/zfgT440NTILGxDBzxHVL5XtW24lg='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" />
  <title>CF-Panel — Concordance Factor Explorer</title>
  <style>
    /* Prevent first-frame flash — apply theme background before React renders */
    html { background: #ffffff; }
    html[data-theme="dark"] { background: #010102; }
  </style>
  <script>try{var t=localStorage.getItem('cfpanel-theme');document.documentElement.setAttribute('data-theme',(t==='dark'||t==='light')?t:'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
